# Free-tier test only. No paid disk or additional service is declared.
services:
  - type: web
    name: faction-war-test
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /app/data
      - key: ADMIN_USERNAME
        value: operator
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: INVITE_CODE
        generateValue: true
